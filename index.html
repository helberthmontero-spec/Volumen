<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Volumen</title>
<link rel="manifest" href="./manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Volumen">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131820" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="icon" href="./icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --line:#D7DCE4; --line-strong:#B6BFCB;
  --ink:#141920; --muted:#5E6876;
  --accent:#2545D9; --accent-ink:#FFFFFF; --accent-soft:#E4E9FB;
  --ok:#158A56; --ok-soft:#DDF3E7; --bad:#C43D3D; --bad-soft:#FAE3E3;
  --chip:#E3E7ED; --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131820; --surface:#1B222D; --line:#2A3441; --line-strong:#3A4655;
    --ink:#EEF1F5; --muted:#9AA5B3;
    --accent:#7E92FF; --accent-ink:#0E1220; --accent-soft:#1F2A4F;
    --ok:#4CCB8B; --ok-soft:#173327; --bad:#F27777; --bad-soft:#3B1F1F;
    --chip:#27303C;
  }
}
:root[data-theme="dark"]{
  --bg:#131820; --surface:#1B222D; --line:#2A3441; --line-strong:#3A4655;
  --ink:#EEF1F5; --muted:#9AA5B3;
  --accent:#7E92FF; --accent-ink:#0E1220; --accent-soft:#1F2A4F;
  --ok:#4CCB8B; --ok-soft:#173327; --bad:#F27777; --bad-soft:#3B1F1F;
  --chip:#27303C;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
body.nonav{padding-bottom:24px}
#app{max-width:520px;margin:0 auto;padding:10px 16px 24px}
h1,h2,h3{margin:0;font-family:'Barlow Condensed','Barlow',system-ui,sans-serif;font-weight:600;letter-spacing:.01em;line-height:1.15}
h1{font-size:28px}
h2{font-size:22px;margin:18px 0 10px}
h3{font-size:20px}
p{margin:0 0 8px}
.num{font-family:'Barlow Condensed','Barlow',system-ui,sans-serif;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.mt{margin-top:12px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:0 16px;border-radius:var(--radius);font-weight:600;border:1px solid var(--line-strong);background:var(--surface);color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:0 8px}
.btn.danger{color:var(--bad);border-color:transparent;background:transparent}
.btn.danger-solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.block{width:100%}
.btn.big{min-height:52px;font-size:18px}
.btn:disabled{opacity:.45;cursor:default}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;min-height:44px;padding:0 12px;font-size:16px;width:100%}
textarea{min-height:120px;padding:10px 12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;resize:vertical;line-height:1.35}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5}
.top,.wk-top{padding-top:calc(8px + env(safe-area-inset-top))}
.in-viewer #app{padding-top:56px}
.in-viewer .top,.in-viewer .wk-top{position:static}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.top h1{flex:1;text-align:center}
.top h1:first-child{text-align:left}
.icon{width:40px;height:40px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;font-size:18px;color:var(--muted)}
.icon:disabled{opacity:.3}
.icon.danger{color:var(--bad)}
.icon svg{width:22px;height:22px}
.row-between{display:flex;justify-content:space-between;align-items:center}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:var(--radius);padding:12px 14px;margin:8px 0 4px}
.banner div{display:flex;flex-direction:column;min-width:0}
.banner span{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--radius);padding:20px 16px;margin-top:6px}
.empty p{margin:0 0 8px}
.empty .btn{margin-top:6px}
/* Rutinas */
.rt{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px}
.rt p{margin:3px 0 0}
.rt .preview{margin-top:6px;font-size:15px}
.rt-actions{display:flex;gap:8px;margin-top:12px}
.rt-actions .btn:first-child{flex:1}
/* Editor de rutina */
.field{display:block;margin:10px 0 4px}
.field span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.exrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px}
.exrow-top{display:flex;align-items:center;gap:8px}
.exrow-n{width:20px;color:var(--muted);font-size:18px;text-align:center;flex:none}
.exrow-meta{display:grid;grid-template-columns:64px 1fr auto;gap:8px;align-items:end;margin-top:8px;padding-left:28px}
.exrow-meta label{font-size:13px;color:var(--muted);display:block}
.exrow-meta label input{margin-top:2px;min-height:40px;padding:0 8px}
.exrow-ctl{display:flex;justify-content:flex-end;gap:2px;margin-top:4px}
/* Entrenamiento */
.wk-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:8px 0 10px;z-index:5;border-bottom:1px solid var(--line)}
.wk-title{min-width:0;display:flex;flex-direction:column}
.wk-title h1{font-size:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-size:22px;color:var(--muted)}
.ex{padding:16px 0 12px;border-bottom:1px solid var(--line)}
.ex-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ex-head .icon{width:32px;height:32px}
.last{margin:2px 0 10px;color:var(--muted);font-size:15px}
.last b{color:var(--ink);font-weight:500}
.setrow{display:grid;grid-template-columns:34px 1fr 1fr 50px 28px;gap:8px;align-items:center;margin-bottom:8px}
.setrow.hd{font-size:13px;color:var(--muted);margin-bottom:4px;text-align:center}
.setrow.hd span:first-child{text-align:center}
.set-n{color:var(--muted);font-size:20px;text-align:center}
.set input{text-align:center;font-family:'Barlow Condensed','Barlow',sans-serif;font-size:22px;font-weight:600;min-height:46px;padding:0 6px}
.chk{width:50px;height:46px;border-radius:8px;border:1.5px solid var(--line-strong);display:flex;align-items:center;justify-content:center;font-size:22px;color:transparent;background:var(--surface)}
.set.done .chk{background:var(--ok);border-color:var(--ok);color:#fff}
.set.done input{background:var(--ok-soft);border-color:var(--ok-soft)}
.set-del{color:var(--muted);font-size:16px;text-align:center;height:46px}
.wcell{position:relative;min-width:0}
.wcell input{padding-right:32px;width:100%}
.ucap{position:absolute;right:4px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;padding:3px 5px;border-radius:5px;background:var(--chip);color:var(--muted);line-height:1;font-family:'Barlow',sans-serif}
.ucap.diff{background:var(--accent-soft);color:var(--accent)}
.set.done .ucap{background:rgba(0,0,0,.08);color:var(--ok)}
.uhead{font-size:12px;font-weight:700;padding:3px 7px;border-radius:6px;background:var(--accent-soft);color:var(--accent);margin-left:2px;vertical-align:baseline;font-family:'Barlow',sans-serif}
.useg{display:inline-flex;background:var(--chip);border-radius:8px;padding:2px;gap:2px;height:40px;margin-top:2px}
.useg button{min-width:40px;padding:0 8px;border-radius:6px;font-weight:700;font-size:14px;color:var(--muted)}
.useg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.fld{display:block;margin:10px 0 4px}
.fld>span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.exrow-meta .fld{margin:0;font-size:13px}
.exrow-meta .fld>span{font-size:13px;margin-bottom:0}
.convrow{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.convrow strong{font-size:20px;font-weight:600;white-space:nowrap}
.ex .btn.ghost{margin-top:2px}
.wk-foot{margin:20px 0 8px;display:flex;flex-direction:column;gap:8px}
/* Historial */
.day{font-family:'Barlow',sans-serif;font-size:15px;color:var(--muted);font-weight:600;margin:18px 0 4px}
.ses{border-top:1px solid var(--line)}
.ses:last-of-type{border-bottom:1px solid var(--line)}
.ses-head{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;text-align:left}
.ses-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.ses-kpi{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex:none}
.ses-kpi strong{font-size:22px;font-weight:600}
.ses-body{padding:0 0 12px}
.ses-ex{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px dashed var(--line)}
.ses-ex-top{display:flex;justify-content:space-between;align-items:center;font-weight:500;gap:8px}
.ses-act{display:flex;gap:8px;margin-top:10px}
.ses-act .btn{flex:1}
.tag{display:inline-block;font-family:'Barlow',sans-serif;font-size:12px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--muted);margin-left:6px;vertical-align:middle;white-space:nowrap}
.tag.up{background:var(--ok-soft);color:var(--ok)}
.tag.down{background:var(--bad-soft);color:var(--bad)}
/* Progreso */
.sel{margin-top:6px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px;margin:12px 0}
.seg button{flex:1;min-height:38px;border-radius:8px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:8px 6px 2px}
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:'Barlow',sans-serif;font-size:11px;fill:var(--muted)}
.chart text.lbl{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:600;fill:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.stats>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:10px;display:flex;flex-direction:column;gap:1px;min-width:0}
.stats span{font-size:13px}
.stats strong{font-size:22px;font-weight:600;white-space:nowrap}
.hrow{display:grid;grid-template-columns:52px 1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.hrow .hdate{color:var(--muted);font-size:14px}
.hrow .sets{font-size:15px;color:var(--muted)}
.hrow .hvol{white-space:nowrap}
/* Ajustes */
.block{margin-bottom:6px}
.block .rt-actions .btn{flex:1}
/* Navegación */
#nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 0 calc(6px + env(safe-area-inset-bottom));z-index:6}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;color:var(--muted);font-size:13px;font-weight:600}
#nav button.on{color:var(--accent)}
#nav svg{width:24px;height:24px}
/* Modal y aviso */
#modal{position:fixed;inset:0;z-index:20;display:none;align-items:flex-end;justify-content:center;background:rgba(10,14,20,.5)}
#modal.show{display:flex}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin-bottom:10px}
.mact{display:flex;gap:8px;margin-top:16px}
.mact .btn{flex:1}
.mmsg{font-size:17px;margin:4px 0 0}
.msum{font-size:30px;margin:6px 0 10px}
.msum .muted{font-family:'Barlow',sans-serif;font-size:15px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<nav id="nav" aria-label="Secciones">
  <button data-act="go" data-view="routines"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M18 7v10M2.5 10v4M21.5 10v4M6 12h12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg><span>Rutinas</span></button>
  <button data-act="go" data-view="history"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 7.5v4.8l3 1.9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Historial</span></button>
  <button data-act="go" data-view="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 18.5l5.5-7 4 4 7.5-9.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Progreso</span></button>
  <button data-act="go" data-view="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span>Ajustes</span></button>
</nav>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<datalist id="exlist"></datalist>
<script>
(() => {
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const uid = (p) => (p || '') + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const norm = (s) => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = new Intl.NumberFormat('es-CR', { maximumFractionDigits: 1 });
const fmt = (n) => nf.format(Math.round((Number(n) || 0) * 10) / 10);
const num = (v) => { if (v === null || v === undefined) return null; const s = String(v).trim().replace(',', '.'); if (!s) return null; const n = parseFloat(s); return Number.isFinite(n) ? n : null; };
const clone = (o) => JSON.parse(JSON.stringify(o));
const cap = (s) => (s ? s.charAt(0).toUpperCase() + s.slice(1) : s);
const pad2 = (n) => String(n).padStart(2, '0');
const localDay = (d) => { const x = new Date(d); return `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())}`; };
const dShort = (d) => new Date(d).toLocaleDateString('es-CR', { day: 'numeric', month: 'short' });
const dLong = (d) => cap(new Date(d).toLocaleDateString('es-CR', { weekday: 'long', day: 'numeric', month: 'long' }));
const tShort = (d) => new Date(d).toLocaleTimeString('es-CR', { hour: 'numeric', minute: '2-digit' });
const rel = (d) => { const a = new Date(localDay(d) + 'T00:00'); const b = new Date(localDay(new Date()) + 'T00:00'); const days = Math.round((b - a) / 86400000); if (days === 0) return 'hoy'; if (days === 1) return 'ayer'; if (days > 1 && days < 7) return `hace ${days} días`; return dShort(d); };

const EXLIST = ['Press de banca', 'Press de banca inclinado', 'Press inclinado con mancuernas', 'Press de pecho en máquina', 'Aperturas con mancuernas', 'Cruce de poleas', 'Fondos en paralelas', 'Press militar', 'Press de hombro con mancuernas', 'Press Arnold', 'Elevaciones laterales', 'Elevaciones frontales', 'Pájaros (deltoide posterior)', 'Face pull', 'Extensión de tríceps en polea', 'Extensión de tríceps sobre cabeza', 'Press francés', 'Press cerrado', 'Dominadas', 'Jalón al pecho', 'Remo con barra', 'Remo con mancuerna', 'Remo en polea baja', 'Remo en máquina', 'Pullover', 'Encogimientos', 'Curl de bíceps con barra', 'Curl con mancuernas', 'Curl martillo', 'Curl predicador', 'Curl en polea', 'Sentadilla', 'Sentadilla hack', 'Sentadilla búlgara', 'Prensa de piernas', 'Peso muerto', 'Peso muerto rumano', 'Hip thrust', 'Zancadas', 'Extensión de cuádriceps', 'Curl femoral', 'Buenos días', 'Hiperextensiones', 'Elevación de talones', 'Abductores en máquina', 'Aductores en máquina', 'Crunch en polea', 'Elevación de piernas', 'Plancha', 'Farmer walk', 'Kettlebell swing'];

const S = { routines: [], sessions: [], settings: { unit: 'kg', entryUnit: 'kg' }, cvU: 'kg', cvVal: '', view: 'routines', lastView: null, editId: null, draft: null, active: null, progEx: null, progMetric: 'volume', open: {}, histLimit: 30, mode: 'loading', db: null, downloads: null };

const LS = {
  get(k) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : null; } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* sin almacenamiento local */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* nada */ } }
};

/* Unidades: cada set guarda la unidad con la que se anotó (u = 'kg' | 'lb');
   totales, récords y gráficos se muestran en la unidad de visualización (settings.unit). */
const LB = 0.45359237;
const isU = (u) => u === 'kg' || u === 'lb';
const dispU = () => (isU(S.settings.unit) ? S.settings.unit : 'kg');
const entryU = () => (isU(S.settings.entryUnit) ? S.settings.entryUnit : dispU());
const other = (u) => (u === 'lb' ? 'kg' : 'lb');
const conv = (w, from, to) => { w = Number(w) || 0; if (from === to) return w; return from === 'lb' ? w * LB : w / LB; };
const r1 = (x) => Math.round(x * 10) / 10;
const setU = (s, fb) => (s && isU(s.u) ? s.u : (isU(fb) ? fb : 'kg'));
const majorityU = (sets, fb) => { const c = { kg: 0, lb: 0 }; setsOf({ sets }).forEach((s) => { c[setU(s, fb)]++; }); if (!c.kg && !c.lb) return isU(fb) ? fb : entryU(); return c.lb > c.kg ? 'lb' : 'kg'; };
const exsOf = (s) => (s && Array.isArray(s.exercises) ? s.exercises : []);
const setsOf = (e) => (e && Array.isArray(e.sets) ? e.sets : []);
const vol = (sets, fb) => setsOf({ sets }).reduce((a, s) => a + conv(num(s.w) || 0, setU(s, fb), dispU()) * (num(s.r) || 0), 0);
const maxW = (sets, fb) => setsOf({ sets }).reduce((a, s) => Math.max(a, conv(num(s.w) || 0, setU(s, fb), dispU())), 0);
const e1rm = (sets, fb) => setsOf({ sets }).reduce((a, s) => { const w = conv(num(s.w) || 0, setU(s, fb), dispU()), r = num(s.r) || 0; if (r <= 0) return a; return Math.max(a, r === 1 ? w : w * (1 + r / 30)); }, 0);
const sessionVol = (s) => exsOf(s).reduce((a, e) => a + vol(e.sets, s.unit), 0);
function setsStr(sets, fb) {
  const ss = setsOf({ sets }); if (!ss.length) return '';
  const us = [...new Set(ss.map((s) => setU(s, fb)))];
  if (us.length === 1) return ss.map((s) => `${fmt(num(s.w) || 0)}×${num(s.r) || 0}`).join(', ') + ` ${us[0]}`;
  return ss.map((s) => `${fmt(num(s.w) || 0)} ${setU(s, fb)}×${num(s.r) || 0}`).join(', ');
}
function normalizeSession(s) {
  const fb = isU(s.unit) ? s.unit : 'kg';
  return Object.assign({}, s, { exercises: exsOf(s).map((e) => ({ name: e.name, sets: setsOf(e).map((x) => ({ w: x.w, r: x.r, u: setU(x, fb) })) })) });
}

function lastPerf(name, excludeId, beforeDate) {
  const k = norm(name);
  for (const s of S.sessions) {
    if (excludeId && s.id === excludeId) continue;
    if (beforeDate && s.date >= beforeDate) continue;
    const e = exsOf(s).find((x) => norm(x.name) === k);
    if (e) return { date: s.date, sets: setsOf(e).map((x) => ({ w: x.w, r: x.r, u: setU(x, s.unit) })) };
  }
  return null;
}
function upsert(arr, item) { const i = arr.findIndex((x) => x.id === item.id); if (i >= 0) arr[i] = item; else arr.push(item); }
function dbFail(e) {
  const code = e && e.code;
  if (code === 'quota_exceeded') toast('Se llenó el espacio de datos. Hay que eliminar entrenamientos viejos.');
  else if (code === 'invalid_argument') toast('No se pudo guardar: dato inválido.');
  else toast('No se pudo guardar en la nube. Vale la pena intentar de nuevo.');
  console.error(e);
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

const P = {
  cache() { LS.set('vol.cache', { mode: S.mode, routines: S.routines, sessions: S.sessions, settings: S.settings }); },
  sortLocal() {
    S.sessions.sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
    S.routines.sort((a, b) => ((a.order ?? 0) - (b.order ?? 0)) || String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
  },
  async write(path, data) {
    if (!S.db) return;
    try { await S.db.doc(path).set(clone(data)); }
    catch (e) {
      if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 600); try { await S.db.doc(path).set(clone(data)); return; } catch (e2) { dbFail(e2); return; } }
      dbFail(e);
    }
  },
  async del(path) {
    if (!S.db) return;
    try { await S.db.doc(path).delete(); }
    catch (e) {
      if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 600); try { await S.db.doc(path).delete(); return; } catch (e2) { dbFail(e2); return; } }
      dbFail(e);
    }
  },
  async saveRoutine(r) { upsert(S.routines, r); P.sortLocal(); P.cache(); await P.write('routines/' + r.id, r); },
  async deleteRoutine(id) { S.routines = S.routines.filter((x) => x.id !== id); P.cache(); await P.del('routines/' + id); },
  async saveSession(s) { upsert(S.sessions, s); P.sortLocal(); P.cache(); await P.write('sessions/' + s.id, s); },
  async deleteSession(id) { S.sessions = S.sessions.filter((x) => x.id !== id); P.cache(); await P.del('sessions/' + id); },
  async saveSettings() { P.cache(); await P.write('settings/main', S.settings); }
};

function elapsed() {

function delta(v, pv) {
  if (pv === null || pv === undefined) return `<span class="tag">nuevo</span>`;
  const d = v - pv;
  if (Math.abs(d) < 0.5) return `<span class="tag">igual</span>`;
  return `<span class="tag ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : '−'}${fmt(Math.abs(d))}</span>`;
}
function dayLabel(d) { const r = rel(d); if (r === 'hoy') return 'Hoy'; if (r === 'ayer') return 'Ayer'; return dLong(d); }

function vHistory() {
  let h = `<header class="top"><h1>Historial</h1></header>`;
  if (!S.sessions.length) return h + `<div class="empty"><p>Todavía no hay entrenamientos guardados.</p><p class="muted">Al terminar un entrenamiento queda aquí con la fecha, cada set y el peso levantado.</p></div>`;
  let lastDay = '';
  S.sessions.slice(0, S.histLimit).forEach((s) => {

    if (day !== lastDay) { h += `<h2 class="day">${dayLabel(s.date)}</h2>`; lastDay = day; }

    if (open) {

        h += `<div class="ses-ex"><div class="ses-ex-top"><span>${esc(e.name)}</span><span class="num">${fmt(v)} ${delta(v, pv)}</span></div><span class="num muted">${setsStr(e.sets, s.unit)}</span></div>`;
      });
      h += `<div class="ses-act"><button class="btn" data-act="hs-edit" data-id="${esc(s.id)}">Editar</button><button class="btn danger" data-act="hs-del" data-id="${esc(s.id)}">Eliminar</button></div></div>`;
    }
    h += `</article>`;
  });
  if (S.sessions.length > S.histLimit) h += `<button class="btn block mt" data-act="hs-more">Mostrar más</button>`;
  return h;
}

function exerciseIndex() {
  const m = new Map();
  S.sessions.forEach((s) => exsOf(s).forEach((e) => {
    const k = norm(e.name); if (!k) return;
    const o = m.get(k) || { key: k, name: e.name, count: 0, last: '' };
    o.count++; if (s.date > o.last) { o.last = s.date; o.name = e.name; }
    m.set(k, o);
  }));
  return [...m.values()].sort((a, b) => b.count - a.count || a.name.localeCompare(b.name));
}
function exHistory(key) {
  const out = [];
  S.sessions.forEach((s) => exsOf(s).forEach((e) => { if (norm(e.name) === key) out.push({ date: s.date, sets: setsOf(e), sid: s.id }); }));
  return out.sort((a, b) => String(a.date).localeCompare(String(b.date)));
}
function weekStart(dt) { const d = new Date(dt); const day = (d.getDay() + 6) % 7; d.setDate(d.getDate() - day); d.setHours(0, 0, 0, 0); return d; }

function lineChart(pts, u) {
  if (!pts.length) return '<p class="muted">Sin datos.</p>';
  const W = 360, H = 210, pl = 46, pr = 16, pt = 24, pb = 30;
  const vs = pts.map((p) => p.v); let lo = Math.min(...vs), hi = Math.max(...vs);
  if (hi === lo) { const m = Math.max(1, lo * 0.1); hi = lo + m; lo = Math.max(0, lo - m); }
  const pad = (hi - lo) * 0.2; const y0 = Math.max(0, lo - pad), y1 = hi + pad;
  const n = pts.length; const x = (i) => pl + (n === 1 ? 0.5 : i / (n - 1)) * (W - pl - pr); const y = (v) => pt + (1 - (v - y0) / (y1 - y0)) * (H - pt - pb);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Progresión por sesión">`;
  [y0, (y0 + y1) / 2, y1].forEach((v) => { s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`; });
  s += `<path d="${pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  pts.forEach((p, i) => { s += `<circle cx="${x(i).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="${i === n - 1 ? 5 : 3.5}" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"/>`; });
  const last = pts[n - 1];
  s += `<text x="${Math.min(x(n - 1), W - pr - 28).toFixed(1)}" y="${(y(last.v) - 10).toFixed(1)}" text-anchor="middle" class="lbl">${fmt(last.v)} ${esc(u)}</text>`;
  const idx = n <= 3 ? pts.map((_, i) => i) : [0, Math.floor((n - 1) / 2), n - 1];
  idx.forEach((i) => { s += `<text x="${x(i).toFixed(1)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === n - 1 ? 'end' : 'middle'}">${dShort(pts[i].d)}</text>`; });
  return s + '</svg>';
}
function barChart(weeks, u) {
  const W = 360, H = 210, pl = 46, pr = 10, pt = 24, pb = 30; const n = weeks.length;
  const hi = Math.max(1, ...weeks.map((w) => w.v)); const bw = (W - pl - pr) / n; const y = (v) => pt + (1 - v / hi) * (H - pt - pb);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Volumen semanal">`;
  [0, hi / 2, hi].forEach((v) => { s += `<line x1="${pl}" x2="${W - pr}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${(y(v) + 4).toFixed(1)}" text-anchor="end">${fmt(v)}</text>`; });
  weeks.forEach((w, i) => {
    const x0 = pl + i * bw + bw * 0.15; const bh = Math.max(0, (H - pb) - y(w.v));
    s += `<rect x="${x0.toFixed(1)}" y="${y(w.v).toFixed(1)}" width="${(bw * 0.7).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="var(--accent)" opacity="${i === n - 1 ? 1 : 0.45}"/>`;
    if (i % 4 === 0 || i === n - 1) s += `<text x="${(x0 + bw * 0.35).toFixed(1)}" y="${H - 8}" text-anchor="middle">${dShort(w.start)}</text>`;
  });
  const cur = weeks[n - 1];
  if (cur && cur.v > 0) s += `<text x="${(pl + (n - 1) * bw + bw * 0.5).toFixed(1)}" y="${(y(cur.v) - 8).toFixed(1)}" text-anchor="${n > 1 ? 'end' : 'middle'}" class="lbl">${fmt(cur.v)} ${esc(u)}</text>`;
  return s + '</svg>';
}
function weeklySection() {
  const weeks = []; const now = weekStart(new Date());
  for (let i = 11; i >= 0; i--) { const d = new Date(now); d.setDate(d.getDate() - i * 7); weeks.push({ start: d, v: 0, n: 0 }); }
  S.sessions.forEach((s) => { const ws = weekStart(new Date(s.date)).getTime(); const w = weeks.find((x) => x.start.getTime() === ws); if (w) { w.v += sessionVol(s); w.n++; } });
  const u = dispU();
  return `<div class="chart mt">${barChart(weeks, u)}</div><p class="muted small mt">Últimas 12 semanas, de lunes a domingo. Volumen = suma de peso × reps de todos los ejercicios.</p>`;
}

function vProgress() {
  let h = `<header class="top"><h1>Progreso</h1></header>`;
  if (!S.sessions.length) return h + `<div class="empty"><p>Sin datos todavía.</p><p class="muted">Con entrenamientos guardados, aquí aparece la progresión de cada ejercicio: volumen, peso máximo y 1RM estimado por sesión.</p></div>`;
  const idx = exerciseIndex();
  if (!S.progEx || (S.progEx !== '__week' && !idx.some((e) => e.key === S.progEx))) S.progEx = idx.length ? idx[0].key : '__week';
  h += `<select id="progEx" class="sel" aria-label="Ejercicio"><option value="__week"${S.progEx === '__week' ? ' selected' : ''}>Volumen total por semana</option>${idx.map((e) => `<option value="${esc(e.key)}"${S.progEx === e.key ? ' selected' : ''}>${esc(e.name)}</option>`).join('')}</select>`;
  if (S.progEx === '__week') return h + weeklySection();
  const ex = idx.find((e) => e.key === S.progEx); const hist = exHistory(S.progEx); const u = dispU();
  const metrics = [['volume', 'Volumen'], ['max', 'Peso máximo'], ['e1rm', '1RM estimado']];
  h += `<div class="seg" role="tablist">${metrics.map(([k, l]) => `<button role="tab" aria-selected="${S.progMetric === k}" class="${S.progMetric === k ? 'on' : ''}" data-act="pg-metric" data-m="${k}">${l}</button>`).join('')}</div>`;
  const val = (sets) => (S.progMetric === 'volume' ? vol(sets) : S.progMetric === 'max' ? maxW(sets) : e1rm(sets));
  h += `<div class="chart">${lineChart(hist.slice(-30).map((x) => ({ d: x.date, v: val(x.sets) })), u)}</div>`;
  const best = (fn) => hist.reduce((a, x) => { const m = fn(x.sets); return m > a.v ? { v: m, d: x.date } : a; }, { v: 0, d: null });
  const bW = best(maxW), bR = best(e1rm), bV = best(vol);
  const stat = (label, b) => `<div><span class="muted">${label}</span><strong class="num">${fmt(b.v)} ${esc(u)}</strong><span class="muted small">${b.d ? dShort(b.d) : ''}</span></div>`;
  h += `<div class="stats">${stat('Mejor peso', bW)}${stat('Mejor 1RM est.', bR)}${stat('Mejor volumen', bV)}</div>`;
  h += `<h2>Sesiones de ${esc(ex.name)}</h2><div class="hlist">`;
  const desc = hist.slice().reverse();
  desc.slice(0, 20).forEach((x, i) => { const prev = desc[i + 1]; const v = vol(x.sets); h += `<div class="hrow"><span class="hdate">${dShort(x.date)}</span><span class="num sets">${setsStr(x.sets)}</span><span class="num hvol">${fmt(v)} ${delta(v, prev ? vol(prev.sets) : null)}</span></div>`; });
  h += `</div><p class="muted small mt">Todo convertido a ${esc(u)} para poder comparar. Volumen = suma de peso × reps. 1RM estimado con la fórmula de Epley: peso × (1 + reps/30), usando el mejor set de la sesión.</p>`;
  return h;
}

function cvOut() { const v = num(S.cvVal); if (v === null) return '—'; return `= ${fmt(conv(v, S.cvU, other(S.cvU)))} ${other(S.cvU)}`; }
function vSettings() {

function render() {

/* ---------- Modal, aviso ---------- */
function openModal(html, onAction) {

}

/* ---------- Acciones ---------- */
function saveDraft() { if (S.active) LS.set('vol.active', S.active); else LS.del('vol.active'); }
let dt; function saveDraftDebounced() { clearTimeout(dt); dt = setTimeout(saveDraft, 300); }

function startWorkout(r) {
  const exercises = (r ? (r.exercises || []) : []).map((e) => {
    const last = lastPerf(e.name); const target = Math.max(1, parseInt(e.sets, 10) || 3); let sets;
    const unit = isU(e.unit) ? e.unit : entryU();
    if (last && last.sets.length) {
      // Si la unidad de la rutina coincide con lo anotado la última vez, se conservan los sets tal cual
      // (incluidas las excepciones en la otra unidad); si cambió, se convierten como sugerencia.
      const same = last.sets.filter((s) => setU(s, unit) === unit).length;
      const keep = same >= last.sets.length / 2;
      sets = last.sets.map((s) => { const su = setU(s, unit); const w = num(s.w); if (keep || su === unit || w === null) return { w: s.w, r: s.r, u: su, done: false }; return { w: String(r1(conv(w, su, unit))), r: s.r, u: unit, done: false }; });
      while (sets.length < target) { const p = sets[sets.length - 1]; sets.push({ w: p.w, r: p.r, u: p.u, done: false }); }
    } else {
      const m = String(e.reps || '').match(/\d+/); const rr = m ? m[0] : null;
      sets = Array.from({ length: target }, () => ({ w: null, r: rr, u: unit, done: false }));
    }
    return { name: e.name, targetReps: e.reps || '', unit, last, sets };
  });
  S.active = { routineId: r ? r.id : null, routineName: r ? r.name : '', startedAt: new Date().toISOString(), exercises };
  saveDraft(); S.view = 'workout'; render();
  if (!r) openAddExercise();
}

function toggleSet(i, j, btn) {
  const s = S.active.exercises[i].sets[j];
  if (!s.done && !(num(s.r) > 0)) { toast(`Faltan las reps del set ${j + 1}`); return; }
  s.done = !s.done;
  const row = btn.closest('.setrow'); if (row) row.classList.toggle('done', s.done);
  btn.setAttribute('aria-pressed', s.done ? 'true' : 'false');
  saveDraft();
}
function addSet(i) {
  const e = S.active.exercises[i];
  const p = e.sets.slice().reverse().find((s) => num(s.w) !== null || num(s.r) !== null);
  e.sets.push({ w: p ? p.w : null, r: p ? p.r : null, done: false });
  saveDraft(); render();
}
function openAddExercise() {
  openModal(`<h3>Agregar ejercicio</h3><input id="m-exname" list="exlist" placeholder="Nombre del ejercicio" autocomplete="off"><div class="mact"><button class="btn" data-m="no">Cancelar</button><button class="btn primary" data-m="ok">Agregar</button></div>`, (k) => {
    if (k !== 'ok') { closeModal(); return; }
    const name = $('#m-exname').value.trim(); if (!name) { toast('Falta el nombre del ejercicio'); return; }
    const last = lastPerf(name, S.active.editId, S.active.editId ? S.active.date : null);
    const unit = last && last.sets.length ? majorityU(last.sets) : entryU();
    const sets = last && last.sets.length ? last.sets.map((s) => ({ w: s.w, r: s.r, u: setU(s, unit), done: false })) : Array.from({ length: 3 }, () => ({ w: null, r: null, u: unit, done: false }));
    S.active.exercises.push({ name, targetReps: '', unit, last, sets });
    saveDraft(); closeModal(); render();
  });
  const inp = $('#m-exname');
  inp.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); const ok = $('#modal [data-m="ok"]'); if (ok) ok.click(); } });
  setTimeout(() => inp.focus(), 60);
}

async function saveRoutineDraft() {
  const d = S.draft; const name = String(d.name || '').trim();
  if (!name) { toast('La rutina necesita un nombre'); return; }
  const exercises = d.exercises.map((e) => ({ id: e.id || uid('e'), name: String(e.name || '').trim(), sets: Math.max(1, parseInt(e.sets, 10) || 3), reps: String(e.reps || '').trim(), unit: isU(e.unit) ? e.unit : entryU() })).filter((e) => e.name);
  if (!exercises.length) { toast('Falta al menos un ejercicio con nombre'); return; }
  const existing = S.editId ? S.routines.find((r) => r.id === S.editId) : null;
  const r = { id: S.editId || uid('r'), name, exercises, order: existing ? (existing.order ?? 0) : S.routines.length, createdAt: (existing && existing.createdAt) || new Date().toISOString() };
  S.view = 'routines'; S.draft = null; S.editId = null; render();
  await P.saveRoutine(r); render(); toast('Rutina guardada');
}

async function finishWorkout() {
  const a = S.active; const exs = [];
  a.exercises.forEach((e) => {
    const sets = e.sets.filter((s) => s.done && num(s.r) > 0).map((s) => ({ w: num(s.w) || 0, r: num(s.r), u: setU(s, e.unit) }));
    if (sets.length) exs.push({ name: String(e.name).trim(), sets });
  });
  if (!exs.length) { toast('No hay sets marcados como hechos'); return; }
  const now = new Date(); const date = a.editId ? a.date : now.toISOString();
  const duration = a.editId ? (a.duration || null) : Math.round((now.getTime() - new Date(a.startedAt).getTime()) / 60000);
  const session = { id: a.editId || uid('s'), date, day: localDay(date), routineId: a.routineId || null, routineName: a.routineName || '', exercises: exs, duration, unit: dispU() };
  const summary = exs.map((e) => { const prev = lastPerf(e.name, session.id, date); return { name: e.name, vol: vol(e.sets), prevVol: prev ? vol(prev.sets) : null }; });
  const wasEdit = !!a.editId;
  S.active = null; LS.del('vol.active'); S.view = 'history'; S.open[session.id] = true;
  const pending = P.saveSession(session); render();
  if (wasEdit) toast('Cambios guardados'); else showSummary(session, summary);
  await pending; render();
}
function showSummary(session, summary) {
  const u = session.unit || 'kg'; const tv = summary.reduce((a, x) => a + x.vol, 0);
  let h = `<h3>Entrenamiento guardado</h3><p class="msum num">${fmt(tv)} ${esc(u)} <span class="muted">de volumen total</span></p><div class="slist">`;
  summary.forEach((x) => { h += `<div class="srow"><span>${esc(x.name)}</span><span class="num">${fmt(x.vol)} ${delta(x.vol, x.prevVol)}</span></div>`; });
  h += `</div><p class="muted small mt">Comparado con la última vez que se hizo cada ejercicio.</p><div class="mact"><button class="btn primary" data-m="ok">Listo</button></div>`;
  openModal(h, () => closeModal());
}
function editSession(id) {
  const s = S.sessions.find((x) => x.id === id); if (!s) return;
  if (S.active && !S.active.editId) { toast('Hay un entrenamiento en curso. Hay que terminarlo o descartarlo primero.'); return; }
  S.active = { editId: s.id, date: s.date, duration: s.duration || null, routineId: s.routineId || null, routineName: s.routineName || '', startedAt: s.date, exercises: exsOf(s).map((e) => ({ name: e.name, targetReps: '', unit: majorityU(e.sets, s.unit), last: lastPerf(e.name, s.id, s.date), sets: setsOf(e).map((x) => ({ w: x.w, r: x.r, u: setU(x, s.unit), done: true })) })) };
  saveDraft(); S.view = 'workout'; render();
}

function backupJson() {
  return JSON.stringify({ app: 'volumen', version: 1, exportedAt: new Date().toISOString(), settings: S.settings, routines: S.routines, sessions: S.sessions }, null, 1);
}
async function backup() {
  const data = backupJson();
  const filename = `volumen-respaldo-${localDay(new Date())}.json`;
  if (S.downloads) {
    try { await S.downloads.save({ filename, data }); toast('Respaldo guardado'); return; }
    catch (e) { if (e && e.code === 'declined') return; }
  } else if (!window.claude) {
    try {
      const file = new File([data], filename, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Respaldo de Volumen' }); return; }
      const url = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000); toast('Respaldo descargado'); return;
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  openModal(`<h3>Respaldo</h3><p class="muted small">Este texto contiene todas las rutinas y entrenamientos. Conviene copiarlo y guardarlo en un lugar seguro.</p><textarea id="m-backup" rows="8" readonly>${esc(data)}</textarea><div class="mact"><button class="btn" data-m="no">Cerrar</button><button class="btn primary" data-m="copy">Copiar</button></div>`, async (k) => {
    if (k === 'copy') { try { await navigator.clipboard.writeText(data); toast('Copiado'); } catch (e) { const t = $('#m-backup'); if (t) t.select(); toast('Seleccionado; copiar manualmente'); } }
    else closeModal();
  });
}
async function applyBackup(textJson) {
  let obj; try { obj = JSON.parse(textJson); } catch (e) { toast('El archivo no es un respaldo válido'); return false; }
  if (!obj || !Array.isArray(obj.routines) || !Array.isArray(obj.sessions)) { toast('El archivo no es un respaldo válido'); return false; }
  closeModal(); toast('Restaurando…');
  for (const r of obj.routines) if (r && r.id && r.name) await P.saveRoutine(r);
  for (const s of obj.sessions) if (s && s.id && s.date) await P.saveSession(normalizeSession(s));
  if (obj.settings && (isU(obj.settings.unit) || isU(obj.settings.entryUnit))) { if (isU(obj.settings.unit)) S.settings.unit = obj.settings.unit; if (isU(obj.settings.entryUnit)) S.settings.entryUnit = obj.settings.entryUnit; await P.saveSettings(); }
  render(); toast('Respaldo restaurado'); return true;
}
function openRestore() {
  openModal(`<h3>Restaurar respaldo</h3><p class="muted small">Las rutinas y entrenamientos del respaldo se suman a los existentes; los que tengan el mismo id se reemplazan.</p><label class="btn block filebtn">Elegir archivo de respaldo<input type="file" id="m-file" accept=".json,application/json"></label><p class="muted small mt">O pegar aquí el contenido del respaldo:</p><textarea id="m-restore" rows="6" placeholder='{"app":"volumen", ...}'></textarea><div class="mact"><button class="btn" data-m="no">Cancelar</button><button class="btn primary" data-m="ok">Restaurar</button></div>`, async (k) => {
    if (k === 'no' || k === null) { closeModal(); return; }
    if (k === 'ok') await applyBackup($('#m-restore').value);
  });
  const f = $('#m-file');
  f.addEventListener('change', async () => {
    const file = f.files && f.files[0]; if (!file) return;
    try { const txt = await file.text(); await applyBackup(txt); } catch (e) { toast('No se pudo leer el archivo'); }
  });
}

document.addEventListener('click', async (ev) => {
  const b = ev.target.closest('[data-act]'); if (!b) return;
  const d = b.dataset;
  switch (d.act) {
    case 'go': S.view = d.view; render(); break;
    case 'new-routine': S.editId = null; S.draft = { name: '', exercises: [newEx()] }; S.view = 'edit'; render(); break;
    case 'edit-routine': { const r = S.routines.find((x) => x.id === d.id); if (!r) return; S.editId = r.id; S.draft = { name: r.name, exercises: clone(r.exercises || []) }; S.view = 'edit'; render(); break; }
    case 'start': case 'start-free': {
      const r = d.act === 'start' ? S.routines.find((x) => x.id === d.id) : null;
      if (d.act === 'start' && !r) return;
      if (S.active && !(await confirmM(S.active.editId ? 'Hay una edición pendiente. ¿Descartarla y empezar un entrenamiento?' : 'Hay un entrenamiento en curso. ¿Descartarlo y empezar otro?', 'Descartar y empezar'))) return;
      startWorkout(r); break;
    }
    case 'continue': S.view = 'workout'; render(); break;
    case 'ed-add': { S.draft.exercises.push(newEx()); render(); const ins = $$('.ed-exname'); const l = ins[ins.length - 1]; if (l) l.focus(); break; }
    case 'ed-up': { const i = +d.i; const a = S.draft.exercises; if (i > 0) { [a[i - 1], a[i]] = [a[i], a[i - 1]]; render(); } break; }
    case 'ed-down': { const i = +d.i; const a = S.draft.exercises; if (i < a.length - 1) { [a[i + 1], a[i]] = [a[i], a[i + 1]]; render(); } break; }
    case 'ed-del': S.draft.exercises.splice(+d.i, 1); render(); break;
    case 'ed-unit': S.draft.exercises[+d.i].unit = d.u; render(); break;
    case 'ed-cancel': S.view = 'routines'; S.draft = null; S.editId = null; render(); break;
    case 'ed-save': await saveRoutineDraft(); break;
    case 'ed-delroutine': { const id = S.editId; if (await confirmM('¿Eliminar esta rutina? El historial de entrenamientos se conserva.', 'Eliminar')) { S.view = 'routines'; S.draft = null; S.editId = null; render(); await P.deleteRoutine(id); render(); } break; }
    case 'wk-back': S.view = 'routines'; render(); break;
    case 'wk-check': toggleSet(+d.ex, +d.set, b); break;
    case 'wk-addset': addSet(+d.ex); break;
    case 'wk-delset': { S.active.exercises[+d.ex].sets.splice(+d.set, 1); saveDraft(); render(); break; }
    case 'wk-addex': openAddExercise(); break;
    case 'wk-unit-ex': {
      const e = S.active.exercises[+d.ex]; const from = isU(e.unit) ? e.unit : entryU(); const to = other(from); e.unit = to;
      e.sets.forEach((s) => { if (s.done) return; const su = setU(s, from); const w = num(s.w); if (w !== null && su !== to) s.w = String(r1(conv(w, su, to))); s.u = to; });
      saveDraft(); render(); break;
    }
    case 'wk-unit-set': {
      const e = S.active.exercises[+d.ex]; const s = e.sets[+d.set]; s.u = other(setU(s, e.unit));
      b.textContent = s.u; b.classList.toggle('diff', s.u !== e.unit); saveDraft(); break;
    }
    case 'wk-delex': if (await confirmM('¿Quitar este ejercicio del entrenamiento?', 'Quitar')) { S.active.exercises.splice(+d.ex, 1); saveDraft(); render(); } break;
    case 'wk-finish': await finishWorkout(); break;
    case 'wk-discard': { const editing = !!S.active.editId; if (await confirmM(editing ? '¿Cancelar la edición sin guardar los cambios?' : '¿Descartar el entrenamiento? Se pierden los sets de hoy.', editing ? 'Cancelar edición' : 'Descartar')) { S.active = null; LS.del('vol.active'); S.view = editing ? 'history' : 'routines'; render(); } break; }
    case 'hs-toggle': S.open[d.id] = !S.open[d.id]; render(); break;
    case 'hs-more': S.histLimit += 30; render(); break;
    case 'hs-edit': editSession(d.id); break;
    case 'hs-del': if (await confirmM('¿Eliminar este entrenamiento del historial?', 'Eliminar')) { const pending = P.deleteSession(d.id); render(); await pending; render(); } break;
    case 'pg-metric': S.progMetric = d.m; render(); break;
    case 'st-unit': S.settings.unit = d.u; render(); await P.saveSettings(); break;
    case 'st-entry': S.settings.entryUnit = d.u; render(); await P.saveSettings(); break;
    case 'cv-u': S.cvU = d.u; render(); break;
    case 'st-backup': await backup(); break;
    case 'st-restore': openRestore(); break;
    default: break;
  }
});
document.addEventListener('input', (ev) => {
  const t = ev.target; if (!(t instanceof HTMLInputElement)) return;
  if (t.classList.contains('ed-name')) { if (S.draft) S.draft.name = t.value; }
  else if (t.classList.contains('ed-exname')) { if (S.draft) S.draft.exercises[+t.dataset.i].name = t.value; }
  else if (t.classList.contains('ed-sets')) { if (S.draft) S.draft.exercises[+t.dataset.i].sets = t.value; }

  else if (t.classList.contains('wk-w') || t.classList.contains('wk-r')) {

/* ---------- Inicio ---------- */
async function init() {
  $('#exlist').innerHTML = EXLIST.map((n) => `<option value="${esc(n)}">`).join('');
  const inViewer = !!(window.claude && typeof window.claude.use === 'function');
  document.documentElement.classList.add(inViewer ? 'in-viewer' : 'standalone-app');
  if (!inViewer) {
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch (e) { /* opcional */ }
    try { if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('./sw.js').catch(() => {}); } catch (e) { /* opcional */ }
  }
  const c = LS.get('vol.cache');
  if (c) { S.routines = Array.isArray(c.routines) ? c.routines : []; S.sessions = (Array.isArray(c.sessions) ? c.sessions : []).map(normalizeSession); S.settings = Object.assign({ unit: 'kg', entryUnit: 'kg' }, c.settings || {}); P.sortLocal(); }
  const draft = LS.get('vol.active');
  if (draft && Array.isArray(draft.exercises)) { S.active = draft; S.view = 'workout'; }
  render();
  const prevMode = c ? c.mode : null; const localData = { routines: S.routines.slice(), sessions: S.sessions.slice() };
  let db = null;
  if (inViewer) {
    try { db = await window.claude.use('db'); } catch (e) { db = null; }
    window.claude.use('downloads').then((dl) => { S.downloads = dl || null; }).catch(() => {});
  }
  if (!db) { S.mode = 'local'; P.cache(); if (S.view !== 'workout') render(); return; }
  S.db = db; S.mode = 'db';
  const onErr = (e) => { console.error(e); if (e && e.code === 'revoked') { S.db = null; S.mode = 'local'; toast('Se perdió la conexión con la base de datos'); dataChanged(); } };
  let firstR = true, firstS = true;
  db.collection('routines').onSnapshot(async (snap) => {
    if (firstR) { firstR = false; if (snap.empty && prevMode === 'local' && localData.routines.length) { for (const r of localData.routines) await P.write('routines/' + r.id, r); return; } }
    S.routines = snap.docs.map((x) => Object.assign({ id: x.id }, x.data()));
    P.sortLocal(); dataChanged();
  }, onErr);
  db.collection('sessions').orderBy('date', 'desc').limit(1000).onSnapshot(async (snap) => {
    if (firstS) { firstS = false; if (snap.empty && prevMode === 'local' && localData.sessions.length) { for (const s of localData.sessions) await P.write('sessions/' + s.id, s); return; } }
    S.sessions = snap.docs.map((x) => normalizeSession(Object.assign({ id: x.id }, x.data())));
    dataChanged();
  }, onErr);
  db.doc('settings/main').onSnapshot((snap) => {
    if (snap.exists) { const st = snap.data(); if (isU(st.unit)) S.settings.unit = st.unit; if (isU(st.entryUnit)) S.settings.entryUnit = st.entryUnit; dataChanged(); }
    else if (prevMode === 'local' && (S.settings.unit !== 'kg' || S.settings.entryUnit !== 'kg')) { P.write('settings/main', S.settings); }
  }, () => {});
  P.cache();
  if (S.view === 'settings') render();
}
init();
})();
</script>
